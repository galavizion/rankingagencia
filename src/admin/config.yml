backend:
  name: github
  repo: galavizion/rankingagencia
  branch: main
  base_url: https://api.netlify.com

media_folder: "src/assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "posts"
    label: "Blog"
    folder: "src/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Extracto", name: "excerpt", widget: "string", required: false }
      - { label: "Imagen de portada", name: "image", widget: "image", required: false }
      - label: "Etiquetas"
        name: "tags"
        widget: "list"
        default: ["posts"]
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Contenido", name: "body", widget: "markdown" }
